
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant POS</title>
        <link rel="stylesheet" href="css/themes.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/layout.css">
         <link  rel="stylesheet" href="css/cart.css" >
        <link  rel="stylesheet" href="css/orders.css" >
        <link  rel="stylesheet" href="css/inventory.css" >     
</head>
    
<body class="body page-billing" >

    <div class="app">
    
        <!-- MENU CONTAINER: Loads the reusable left sidebar from a separate HTML file -->
        <div class="menu-container" data-load="html/layout/main-menu.html" ></div>
    
        <!-- MAIN CONTENT: Contains the header and dynamically loaded pages -->
        <main class="main-content">
    
            <!-- HEADER CONTAINER: Loads the reusable page header and connection controls -->
            <div class="header-container" id="header-container" data-load="html/layout/header.html"></div>
    
            <!-- PAGE CONTAINER: Router injects the selected page here -->
            <div class="page-container" id="page-container"></div>

            <!-- SIDEBAR CONTAINER: Loads the reusable right sidebar and connection controls -->
            <div class="sidebar-container" id="sidebar-container"></div>
    
        </main>
    </div>

<!-- JAVASCRIPT: Shared navigation utilities and tab management 
    ============================================================= -->
    <script src="js/navigation/popup.js"></script>
    <script src="js/navigation/tabs.js"></script>
    
    <!-- PAGE CONFIGURATION: Defines routes, page titles, descriptions and scripts -->
    <script src="js/navigation/pages.js"></script>
    
    <!-- COMPONENT LOADER: Loads pages and reusable HTML components from any folder -->
    <script src="js/navigation/component-loader.js"></script>
    
    <!-- ROUTER: Handles navigation, nested routes, browser history and active sidebar state -->
    <script src="js/navigation/router.js"></script>
    
    <!-- FEATURE SCRIPTS: Settings and product functionality -->
    <script src="js/settings/settings.js"></script>
    <script src="js/products/products.js"></script>
    
    <!-- APPLICATION ENTRY POINT: Initializes the POS application -->
    <script src="js/app.js"></script>

</body>
</html>
