<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restaurant POS</title>

    <link rel="stylesheet"  href="css/themes.css">

    <link  rel="stylesheet" href="css/style.css" >

    <link rel="stylesheet"  href="css/sidebar.css">

    <link  rel="stylesheet" href="css/cart.css" >

</head>


<body>

<div class="app">


<!-- ==================================================
     SIDEBAR
================================================== -->

<aside class="sidebar">

    <div class="sidebar-brand">

        <div class="sidebar-logo">
            🍗
        </div>

    </div>


    <nav class="sidebar-nav">


        <button
            class="nav-btn"
            data-tab="billing"
        >

            <span class="nav-icon">
                🧾
            </span>

            <span class="nav-label">
                Billing
            </span>

        </button>


        <button
            class="nav-btn"
            data-tab="orders"
        >

            <span class="nav-icon">
                📦
            </span>

            <span class="nav-label">
                Orders
            </span>

        </button>


        <button
            class="nav-btn"
            data-tab="customers"
        >

            <span class="nav-icon">
                👥
            </span>

            <span class="nav-label">
                Customers
            </span>

        </button>


        <button
            class="nav-btn"
            data-tab="products"
        >

            <span class="nav-icon">
                🍔
            </span>

            <span class="nav-label">
                Products
            </span>

        </button>


        <button
            class="nav-btn"
            data-tab="reports"
        >

            <span class="nav-icon">
                📊
            </span>

            <span class="nav-label">
                Reports
            </span>

        </button>


        <button
            class="nav-btn"
            data-tab="marketing"
        >

            <span class="nav-icon">
                📢
            </span>

            <span class="nav-label">
                Marketing
            </span>

        </button>


        <button
            class="nav-btn"
            data-tab="coming-soon"
        >

            <span class="nav-icon">
                🚀
            </span>

            <span class="nav-label">
                Coming Soon
            </span>

        </button>


        <button
            class="nav-btn"
            data-tab="settings"
        >

            <span class="nav-icon">
                ⚙️
            </span>

            <span class="nav-label">
                Settings
            </span>

        </button>


    </nav>


</aside>



<!-- =========================
         MAIN CONTENT
========================== -->

    <main class="main-content">


        <header class="topbar">

            <div>

                <h1 id="page-title">
                    Billing
                </h1>

                <p id="page-description">
                    Create a new order
                </p>

            </div>


            <div class="topbar-actions">

                <button
                    id="force-refresh"
                    class="force-refresh-btn"
                    type="button"
                    title="Clear application cache and reload"
                >
                    ↻ Force Refresh
                </button>
            
                <div class="connection-status">
            
                    🟢 Online
            
                </div>
            
            </div>

        </header>



<!-- ==================================
            PAGE CONTAINER
=================================== -->

        <div id="page-container"></div>



    </main>

</div>


<!-- JavaScript -->

<script src="js/navigation/pages.js"></script>
<script src="js/navigation/tabs.js"></script>

<script src="js/settings/settings.js"></script>

<script src="js/products/products.js"></script>

<script src="js/app.js"></script>


</body>

</html>
