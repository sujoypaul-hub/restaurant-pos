<!-- ==================================
             ORDERS TAB
=================================== -->

<div class="orders-layout">

    <!-- ==========================================
         ORDERS MAIN AREA
         ========================================== -->

    <div class="orders-main">

        <!-- Order Status Tabs -->
    <div
    class="orders-tabs"
    data-tabs="orders"
    data-default-tab="new"
    data-tab-content="orders-content"
>

    <button
        class="orders-tab"
        type="button"
        data-tab="new"
        data-tab-page="orders/new"
        aria-selected="false"
    >
        New
    </button>


    <button
        class="orders-tab"
        type="button"
        data-tab="ongoing"
        data-tab-page="orders/ongoing"
        aria-selected="false"
    >
        On going
    </button>


    <button
        class="orders-tab"
        type="button"
        data-tab="ready"
        data-tab-page="orders/ready"
        aria-selected="false"
    >
        Ready
    </button>


    <button
        class="orders-tab"
        type="button"
        data-tab="closed"
        data-tab-page="orders/closed"
        aria-selected="false"
    >
        Closed
    </button>

</div>
        


        <!-- Orders Content -->

        <div class="orders-content" id="orders-content">

            <div class="orders-empty-state">

                <div class="orders-empty-icon">
                    🧾
                </div>

                <div class="orders-empty-title">
                    No-orders
                </div>

                <div class="orders-empty-description">
                    Orders will appear here.
                </div>

            </div>

        </div>

    </div>


    <!-- ==========================================
         RIGHT SIDEBAR
         ========================================== -->

    <aside class="orders-sidebar">

        <!-- Section 1 -->

        <section class="orders-sidebar-section">

            <h3 class="orders-sidebar-title">
                Order Summary
            </h3>

            <div class="orders-sidebar-content">
                <!-- Reserved for future use -->
            </div>

        </section>


        <!-- Section 2 -->

        <section class="orders-sidebar-section">

            <h3 class="orders-sidebar-title">
                Quick Actions
            </h3>

            <div class="orders-sidebar-content">
                <!-- Reserved for future use -->
            </div>

        </section>

    </aside>

</div>
