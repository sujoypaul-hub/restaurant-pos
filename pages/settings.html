<!-- ==================================
     SETTINGS TAB
=================================== -->

        <section
            class="tab-content"
            data-tab-content="settings"
        >
        
            <div class="page-card">
        
                <h2>
                    ⚙️ Settings
                </h2>
        
                <p>
                    Manage your application settings.
                </p>
        
        
                <!-- Theme Setting -->
        
                <div class="settings-group">
        
                    <div class="setting-info">
        
                        <h3>
                            Appearance
                        </h3>
        
                        <p>
                            Choose between Light and Dark theme.
                        </p>
        
                    </div>
        
        
                    <div class="theme-control">
        
                        <span id="theme-label">
                            Light Mode
                        </span>
        
        
                        <label class="switch">
        
                            <input
                                type="checkbox"
                                id="theme-toggle"
                            >
        
                            <span class="slider"></span>
        
                        </label>
        
                    </div>
        
                </div>
        
            </div>
        
        </section>
