<!-- ==================================
     SETTINGS TAB
=================================== -->

<section class="page-content">

    <div class="page-card">


        <!-- Theme -->

        <button
            class="setting-option List-type-layout"
            data-route="settings/theme"
        >

            <div>
                <h3>🎨 Theme</h3>

                <p>
                    Choose Light or Dark theme.
                </p>
            </div>

        </button>


        <!-- Force Refresh -->

        <button
            class="setting-option List-type-layout"
            id="force-refresh"
        >

            <div>
                <h3>🔄 Force Refresh</h3>

                <p>
                    Refresh the application and clear cache.
                </p>
            </div>

        </button>

    </div>

</section>
