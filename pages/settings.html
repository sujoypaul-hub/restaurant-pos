<div class="settings-page">

    <div class="list-type-layout">

        <button
            class="setting-option"
            data-route="settings/theme"
            type="button"
        >

            <span class="setting-icon">
                🎨
            </span>

            <span class="setting-content">

                <span class="setting-title">
                    Appearance
                </span>

                <span class="setting-description">
                    Choose your application theme.
                </span>

            </span>

        </button>


        <button
            class="setting-option"
            id="force-refresh-button"
            type="button"
        >

            <span class="setting-icon">
                ↻
            </span>

            <span class="setting-content">

                <span class="setting-title">
                    Refresh
                </span>

                <span class="setting-description">
                    Reload the application and refresh its data.
                </span>

            </span>

        </button>

    </div>

</div>
