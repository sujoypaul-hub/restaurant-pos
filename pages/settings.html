<div class="list-type-layout">

    <button
        class="list-item"
        data-route="settings/theme"
        type="button"
    >

        <span class="list-item-icon">
            🎨
        </span>

        <span class="list-item-content">

            <span class="list-item-title">
                Appearance
            </span>

            <span class="list-item-description">
                Choose your application theme.
            </span>

        </span>

    </button>


    <button
        class="list-item"
        id="force-refresh-button"
        type="button"
    >

        <span class="list-item-icon">
            ↻
        </span>

        <span class="list-item-content">

            <span class="list-item-title">
                Refresh
            </span>

            <span class="list-item-description">
                Reload the application and refresh its data.
            </span>

        </span>

    </button>

</div>
