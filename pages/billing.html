<!-- Cart -->
<!-- ==================================================
     CART
================================================== -->

<div class="cart-section">


    <div class="cart-header">

        <h2>
            Current Order
        </h2>

        <span>
            Order #0001
        </span>

    </div>


    <!-- Customer -->

    <!-- Customer -->

<div class="customer-section">

    <div class="customer-heading">

        <strong>
            Customer
        </strong>


        <label class="no-phone-option">

            <input
                type="checkbox"
                id="no-phone-checkbox"
            >

            <span>
                No phone
            </span>

        </label>

    </div>


    <input
        type="tel"
        id="customer-phone"
        placeholder="Enter customer phone number"
        inputmode="numeric"
        maxlength="10"
    >


    <!-- Order type -->

    <div class="order-type">

        <button
            class="order-type-btn"
            type="button"
            data-order-type="delivery"
        >
            Delivery
        </button>


        <button
            class="order-type-btn"
            type="button"
            data-order-type="dine-in"
        >
            Dine In
        </button>


        <button
            class="order-type-btn active"
            type="button"
            data-order-type="takeaway"
        >
            Takeaway
        </button>

    </div>

</div>


    <!-- Items -->

    <div
        class="cart-items"
        id="cart-items"
    >

        <p class="empty-cart">
            No items added yet
        </p>

    </div>


    <!-- Promotion -->

    <div class="promotion-box">

        <span>
            Promotion Code
        </span>

        <button
            class="promotion-btn"
            type="button"
        >
            ADD CODE
        </button>

    </div>


    <!-- Summary -->

    <div class="cart-summary">

        <div>

            <span>
                Subtotal
            </span>

            <strong id="subtotal">
                ₹0
            </strong>

        </div>


        <div>

            <span>
                Discount
            </span>

            <strong id="discount">
                ₹0
            </strong>

        </div>


        <div>

            <span>
                Delivery Charge
            </span>

            <strong id="delivery-charge">
                ₹0
            </strong>

        </div>


        <div class="total">

            <span>
                TOTAL
            </span>

            <strong id="total">
                ₹0
            </strong>

        </div>

    </div>


    <button
        class="payment-btn"
        type="button"
    >
        Confirm Order
    </button>


 </div>



                

            </div> 
</section>
