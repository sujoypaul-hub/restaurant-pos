<!-- ==================================
          INVENTORY PURCHASE
=================================== -->

<div class="list-type-layout">

    <div class="list-items">

        <!-- New Purchase -->

        <button
            class="list-item"
            type="button"
            data-route="inventory/purchase/new"
        >

            <span class="list-item-icon">
                🛒
            </span>

            <span class="list-item-content">

                <span class="list-item-title">
                    New Purchase
                </span>

                <span class="list-item-description">
                    Record a new purchase and add the received quantity to stock.
                </span>

            </span>

            <span class="list-item-right">
                →
            </span>

        </button>


        <!-- Purchase History -->

        <button
            class="list-item"
            type="button"
            data-route="inventory/purchase/history"
        >

            <span class="list-item-icon">
                🧾
            </span>

            <span class="list-item-content">

                <span class="list-item-title">
                    Purchase History
                </span>

                <span class="list-item-description">
                    View previous purchases, suppliers, quantities and costs.
                </span>

            </span>

            <span class="list-item-right">
                →
            </span>

        </button>

    </div>

</div>
