<!-- ==================================
             ORDERS TAB
=================================== -->

<main class="orders-layout page-layout">

  <!-- ==================================
             HEADER TAB - Loads the dynamic page header and connection controls 
  ===================================  -->  
   <div class="header-container" id="header-container" data-load="html/layout/header.html"></div>

  <!-- =========================================
         ORDERS MAIN AREA
  ========================================== -->

   <div class="orders-main page-content"  data-tabs="orders"  data-default-tab="new">

        <!-- ==========================================
             ORDER STATUS TABS
        ========================================== -->

        <div class="orders-tabs">
            <button class="orders-tab" type="button" data-tab="new" data-tab-page="orders/new" aria-selected="false" > New </button> 
            <button class="orders-tab" type="button" data-tab="ongoing" data-tab-page="orders/ongoing" aria-selected="false"> On going </button>
            <button class="orders-tab" type="button" data-tab="ready" data-tab-page="orders/ready" aria-selected="false"> Ready </button>
            <button class="orders-tab" type="button" data-tab="closed" data-tab-page="orders/closed"  aria-selected="false"> Closed </button>
        </div>


        <!-- ==========================================
             ORDERS CONTENT
             ========================================== -->

        <div class="tab-content">
          <div class="orders-empty-state">
              <div class="orders-empty-icon"> 🧾 </div>
              <div class="orders-empty-title"> No orders </div>
              <div class="orders-empty-description"> Orders will appear here. </div>
          </div>
        </div>

    </div>
</main>


<!-- ==========================================
         RIGHT SIDEBAR
 ========================================== -->

  <aside class="page-sidebar page-sidebar-2 right-sidebar">
        
      <!-- Section 1 -->
        <section class="right-sidebar-section">
            <h3 class="right-sidebar-title"> Unpaid Orders </h3>
            <div class="right-sidebar-content"> <!-- Reserved for future use --> </div>
        </section>

        <!-- Section 2 -->
        <section class="right-sidebar-section">
            <h3 class="right-sidebar-title"> Right sidebar content 2 </h3>
            <div class="right-sidebar-content orders-sidebar-content"> <!-- Reserved for future use --> </div>
        </section>
      
  </aside>
