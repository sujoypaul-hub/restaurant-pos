<!-- ==================================
             ORDERS TAB
=================================== -->

<div class="orders-layout page-layout">

    <!-- ==========================================
         ORDERS MAIN AREA
         ========================================== -->

    <div
        class="orders-main"
        data-tabs="orders"
        data-default-tab="new"
    >

        <!-- ==========================================
             ORDER STATUS TABS
             ========================================== -->

        <div class="orders-tabs">

            <button
                class="orders-tab"
                type="button"
                data-tab="new"
                data-tab-page="orders/new"
                aria-selected="false"
            >
                New
            </button>


            <button
                class="orders-tab"
                type="button"
                data-tab="ongoing"
                data-tab-page="orders/ongoing"
                aria-selected="false"
            >
                On going
            </button>


            <button
                class="orders-tab"
                type="button"
                data-tab="ready"
                data-tab-page="orders/ready"
                aria-selected="false"
            >
                Ready
            </button>


            <button
                class="orders-tab"
                type="button"
                data-tab="closed"
                data-tab-page="orders/closed"
                aria-selected="false"
            >
                Closed
            </button>

        </div>


        <!-- ==========================================
             ORDERS CONTENT
             ========================================== -->

        <div class="tab-content">

            <div class="orders-empty-state">

                <div class="orders-empty-icon">
                    🧾
                </div>

                <div class="orders-empty-title">
                    No orders
                </div>

                <div class="orders-empty-description">
                    Orders will appear here.
                </div>

            </div>

        </div>

    </div>


    <!-- ==========================================
         RIGHT SIDEBAR
         ========================================== -->

    <aside class="right-sidebar">

        <!-- Section 1 -->

        <section class="right-sidebar-section">

            <h3 class="right-sidebar-title">
                Unpaid Orders
            </h3>

            <div class="right-sidebar-content">
                <!-- Reserved for future use -->
            </div>

        </section>


        <!-- Section 2 -->

        <section class="right-sidebar-section">

            <h3 class="right-sidebar-title">
                Right sidebar content 2
            </h3>

            <div class="right-sidebar-content orders-sidebar-content">
                <!-- Reserved for future use -->
            </div>
        </section>
      
    </aside>

</div>
