<main class="settings-layout page-layout page-fullwidth">
    <div class="page-content">
        <div class="list-type-layout">
            <div class="list-items">
                <button class="list-item" data-route="settings/appearance" type="button"><span class="list-item-icon">🎨</span><span class="list-item-content"><span class="list-item-title">Appearance</span><span class="list-item-description">Customize the application theme and appearance.</span></span><span class="list-item-right">→</span></button>
                <button class="list-item" data-route="settings/billing" type="button"><span class="list-item-icon">💳</span><span class="list-item-content"><span class="list-item-title">Billing & Payments</span><span class="list-item-description">Configure payment methods, taxes, and payment timing.</span></span><span class="list-item-right">→</span></button>
                <button class="list-item" data-route="settings/orders" type="button"><span class="list-item-icon">🧾</span><span class="list-item-content"><span class="list-item-title">Order & Restaurant Operations</span><span class="list-item-description">Configure order types, preparation workflow, and order handling.</span></span><span class="list-item-right">→</span></button>
                <button class="list-item" data-route="settings/tables" type="button"><span class="list-item-icon">🪑</span><span class="list-item-content"><span class="list-item-title">Table Management</span><span class="list-item-description">Configure tables, table pools, and dine-in sessions.</span></span><span class="list-item-right">→</span></button>
                <button class="list-item" data-route="settings/kitchen" type="button"><span class="list-item-icon">👨‍🍳</span><span class="list-item-content"><span class="list-item-title">Kitchen</span><span class="list-item-description">Enable or disable the kitchen screen and configure ticket handling.</span></span><span class="list-item-right">→</span></button>
                <button class="list-item" id="force-refresh-button" type="button"><span class="list-item-icon">↻</span><span class="list-item-content"><span class="list-item-title">Refresh Application</span><span class="list-item-description">Reload the application and refresh its data.</span></span><span class="list-item-right">→</span></button>
            </div>
        </div>
    </div>
</main>
